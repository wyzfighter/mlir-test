<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'DejaVu Sans', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="3" refY="9" orient="auto">
      <path d="M0,0 L6,0 L3,9 Z" fill="#8a6d1a"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <rect x="0" y="0" width="980" height="60" rx="0" fill="#1f3b57"/>
  <text x="490" y="37" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">OpenMPToLLVM.cpp —— 类型适配器（不是降级器）</text>

  <!-- 输入框 -->
  <rect x="30" y="110" width="230" height="220" rx="10" fill="#eaf2fb" stroke="#2f6fb2" stroke-width="2"/>
  <text x="145" y="140" text-anchor="middle" fill="#1f3b57" font-size="17" font-weight="bold">输入：omp op</text>
  <text x="50" y="172" fill="#222" font-size="14" font-family="'DejaVu Sans Mono', monospace">omp.parallel {</text>
  <text x="66" y="196" fill="#222" font-size="14" font-family="'DejaVu Sans Mono', monospace">num_threads(%n)</text>
  <text x="66" y="218" fill="#222" font-size="14" font-family="'DejaVu Sans Mono', monospace">private(%p)</text>
  <text x="66" y="240" fill="#222" font-size="14" font-family="'DejaVu Sans Mono', monospace">... region ...</text>
  <text x="50" y="262" fill="#222" font-size="14" font-family="'DejaVu Sans Mono', monospace">}</text>
  <text x="145" y="295" text-anchor="middle" fill="#a03030" font-size="13">operand/类型可能还是</text>
  <text x="145" y="313" text-anchor="middle" fill="#a03030" font-size="13">memref / index / i32</text>

  <!-- 中间处理框 -->
  <rect x="320" y="110" width="340" height="380" rx="10" fill="#fff8e6" stroke="#c08a1a" stroke-width="2"/>
  <text x="490" y="140" text-anchor="middle" fill="#6b4d00" font-size="16" font-weight="bold">OpenMPOpConversion&lt;T&gt;::</text>
  <text x="490" y="160" text-anchor="middle" fill="#6b4d00" font-size="16" font-weight="bold">matchAndRewrite（对每个 omp op）</text>

  <!-- 步骤条 -->
  <rect x="340" y="180" width="300" height="40" rx="6" fill="#fff" stroke="#d8a53a" stroke-width="1.5"/>
  <text x="490" y="200" text-anchor="middle" fill="#333" font-size="13.5">1. 转换结果类型</text>
  <text x="490" y="216" text-anchor="middle" fill="#777" font-size="11.5" font-family="'DejaVu Sans Mono', monospace">converter-&gt;convertTypes()</text>

  <rect x="340" y="230" width="300" height="40" rx="6" fill="#fff" stroke="#d8a53a" stroke-width="1.5"/>
  <text x="490" y="250" text-anchor="middle" fill="#333" font-size="13.5">2. 属性：只翻译 TypeAttr</text>
  <text x="490" y="266" text-anchor="middle" fill="#777" font-size="11.5">其余属性原样拷贝</text>

  <rect x="340" y="280" width="300" height="40" rx="6" fill="#fff" stroke="#d8a53a" stroke-width="1.5"/>
  <text x="490" y="300" text-anchor="middle" fill="#333" font-size="13.5">3. operands：换成适配器里的新值</text>
  <text x="490" y="316" text-anchor="middle" fill="#777" font-size="11.5" font-family="'DejaVu Sans Mono', monospace">adaptor.getOperands()</text>

  <rect x="340" y="330" width="300" height="40" rx="6" fill="#fff" stroke="#d8a53a" stroke-width="1.5"/>
  <text x="490" y="350" text-anchor="middle" fill="#333" font-size="13.5">4. region：搬过去 + 转换 block 参数</text>
  <text x="490" y="366" text-anchor="middle" fill="#777" font-size="11.5" font-family="'DejaVu Sans Mono', monospace">inlineRegionBefore / convertRegionTypes</text>

  <rect x="340" y="380" width="300" height="40" rx="6" fill="#fff" stroke="#d8a53a" stroke-width="1.5"/>
  <text x="490" y="400" text-anchor="middle" fill="#333" font-size="13.5">5. T::create 重建同名 op</text>
  <text x="490" y="416" text-anchor="middle" fill="#777" font-size="11.5">6. replaceOp 替换旧 op</text>

  <text x="490" y="465" text-anchor="middle" fill="#a03030" font-size="14" font-weight="bold">关键：不生成 LLVM 指令</text>
  <text x="490" y="484" text-anchor="middle" fill="#a03030" font-size="14" font-weight="bold">不生成 __kmpc_* 调用</text>

  <!-- 输出框 -->
  <rect x="720" y="110" width="230" height="220" rx="10" fill="#e9f7ee" stroke="#2f9e57" stroke-width="2"/>
  <text x="835" y="140" text-anchor="middle" fill="#1d5c33" font-size="17" font-weight="bold">输出：同名 omp op</text>
  <text x="740" y="172" fill="#222" font-size="14" font-family="'DejaVu Sans Mono', monospace">omp.parallel {</text>
  <text x="756" y="196" fill="#222" font-size="14" font-family="'DejaVu Sans Mono', monospace">num_threads(%n)</text>
  <text x="756" y="218" fill="#222" font-size="14" font-family="'DejaVu Sans Mono', monospace">private(%p)</text>
  <text x="756" y="240" fill="#222" font-size="14" font-family="'DejaVu Sans Mono', monospace">... region ...</text>
  <text x="740" y="262" fill="#222" font-size="14" font-family="'DejaVu Sans Mono', monospace">}</text>
  <text x="835" y="295" text-anchor="middle" fill="#1d5c33" font-size="13">类型已 LLVM 化：</text>
  <text x="835" y="313" text-anchor="middle" fill="#1d5c33" font-size="13">!llvm.ptr / i64</text>

  <!-- 箭头：输入→处理→输出 -->
  <line x1="260" y1="220" x2="318" y2="220" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="220" x2="718" y2="220" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 底部对照条：真正的降级 -->
  <rect x="30" y="540" width="920" height="82" rx="10" fill="#fdecec" stroke="#c05050" stroke-width="2"/>
  <text x="490" y="566" text-anchor="middle" fill="#7a1f1f" font-size="15" font-weight="bold">真正的降级在这里（本文件不经过）</text>
  <text x="490" y="592" text-anchor="middle" fill="#333" font-size="13.5" font-family="'DejaVu Sans Mono', monospace">OpenMPToLLVMIRTranslation.cpp</text>
  <text x="490" y="612" text-anchor="middle" fill="#333" font-size="13.5" font-family="'DejaVu Sans Mono', monospace">convertOmpParallel / convertOmpWsloop -&gt; OpenMPIRBuilder -&gt; __kmpc_fork_call / __kmpc_for_static_init_4u</text>

  <!-- 箭头：处理框 → 对照条 -->
  <line x1="490" y1="490" x2="490" y2="538" stroke="#8a6d1a" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowDown)"/>
  <text x="505" y="522" fill="#8a6d1a" font-size="12">类型合法化后，由直译路线收尾</text>

  <!-- 底部说明 -->
  <text x="490" y="633" text-anchor="middle" fill="#888" font-size="11.5">源文件：mlir/lib/Conversion/OpenMPToLLVM/OpenMPToLLVM.cpp（行号已核实）</text>
</svg>
